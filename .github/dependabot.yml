version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  # Dependabot's "npm" ecosystem auto-detects pnpm-lock.yaml — there is no
  # separate "pnpm" ecosystem identifier.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  # Pairs with the SHA-pinned actions in ci.yml (docs/audits/infra-2026-07-26.md
  # INFRA-06) — Dependabot bumps the pinned SHA and its version comment
  # instead of the pin silently going stale.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
