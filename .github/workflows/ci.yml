name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege by default (spec §25.7 / docs/audits/infra-2026-07-26.md
# Phase 3) — neither job needs to write anything back to the repo or call
# the GitHub API.
permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # dtolnay/rust-toolchain has no release tags — `@stable` is itself a
      # branch the maintainer moves forward, by design, so this action
      # always installs whatever Rust release is *currently* stable. Pinned
      # to that branch's current commit anyway (a moving branch ref is a
      # bigger supply-chain risk than a moving tag), which means this now
      # needs a periodic manual bump to keep tracking new stable Rust
      # releases — an explicit, accepted tradeoff, not an oversight.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable, as of 2026-07-26
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2, as of 2026-07-26

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -W clippy::all -D warnings

      # audit.toml's `ignore` list allow-lists the 3 advisories already
      # reviewed and justified in docs/SECURITY.md (SEC-04/SEC-05) — this
      # step fails on any *new* advisory, not on already-accepted risk.
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

      # The Mollusk-based program tests (programs/eventquest/tests/) load
      # the compiled on-chain program from target/deploy/eventquest.so at
      # runtime — `cargo test` alone never produces it, only building for
      # the SBF target does. Version pinned to match local dev (solana-cli
      # 3.1.10 / Agave) — bump both together if either changes.
      - name: Install Solana CLI (for cargo build-sbf)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.10/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Build the on-chain program (for Mollusk tests)
        run: cargo build-sbf --manifest-path programs/eventquest/Cargo.toml

      - name: cargo test
        run: cargo test --workspace

  typescript:
    name: TypeScript (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm -r --filter=./apps/web --filter=./packages/chain-client typecheck

      - name: lint
        run: pnpm --filter=./apps/web lint

      - name: test
        run: pnpm test:ts

      - name: build
        run: pnpm --filter=./apps/web build
